   else if(level===2){txt('HEY!',275,75,1,PAL.cream);ctx.fillStyle=PAL.white;ctx.fillRect(268,81,3,1);ctx.fillRect(273,83,4,1)}
   else if(level===3){pixelStar(266,76+(Math.floor(pose/70)%2),PAL.gold);ctx.fillStyle=PAL.hair;ctx.fillRect(254,82,7,1);ctx.fillRect(258,80,1,4)}
   else if(level===4){ctx.fillStyle=PAL.blue;ctx.fillRect(265,78,8,5);ctx.fillRect(267,76,4,2);ctx.fillStyle=PAL.cream;ctx.fillRect(267,80,1,1);ctx.fillRect(270,80,1,1)}
   else if(level===5){pixelStar(260,76,PAL.orange);pixelStar(271,82,PAL.gold)}
   else if(level===6){ctx.fillStyle=PAL.olive;ctx.fillRect(265,79,3,8);ctx.fillRect(262,82,3,1);ctx.fillRect(268,81,3,1)}
   else if(level===7)txt('...',267,77,1,PAL.cream);
   else if(level===8){ctx.fillStyle=PAL.purple;ctx.fillRect(268,82,7,2);ctx.fillRect(272,79,5,2);pixelStar(265,75,PAL.gold)}
   else {ctx.fillStyle=PAL.grey;ctx.fillRect(270,73,1,4);ctx.fillRect(271,70,1,3);pixelStar(264,77,PAL.red)}
  }}
  if(level===9){txt('PHASE '+(playerWins>0?'2':'1'),160,py+35,1,PAL.gold)}
  if(intro>=1){const line=currentLine(),who=dialogueIndex%2===0?opponent:'SHAUN',before=Math.floor(typed);speechBubble(line.slice(0,Math.floor(typed)),who);typed=Math.min(line.length,typed+frameDelta/25);if(Math.floor(typed)>before)sound('type');txt('TAP / SPACE TO CONTINUE',160,169,1,PAL.white)}else txt('A NEW RIDER APPROACHES...',160,143,1,PAL.white);
  txt('SKIP',299,5,1,PAL.gold,'right');
 }else if(state==='HEAL'){
  if(healSpeaker==='JASMINE'){const t=Math.min(1,sceneTick/850),jx=Math.round(-30+60*(1-Math.pow(1-t,3)));drawSprite(jx,80,'JASMINE');if(t>=.6){pixelHeart(76,73,PAL.red);pixelStar(87,70+(Math.floor(sceneTick/100)%2),PAL.cream);pixelStar(65,76,PAL.gold)}}
  drawSprite(123,86,'SHAUN');speechBubble(healLine,healSpeaker);if(healSpeaker==='JASMINE')txt(health===100?'HEALTH FULL!':'HEALTH RESTORED!',160,169,1,PAL.green);
 }
}
function xorShake(){return false}
function duelScene(){sceneBg();drawSprite(76,82,'SHAUN',{shoot:state==='RESULT'&&(lastRoundWon||lastEarly),fall:state==='RESULT'&&!lastRoundWon&&!lastEarly});drawSprite(240,80,CONFIG.levels[level].name,{flip:true,shoot:state==='RESULT'&&!lastRoundWon,fall:state==='RESULT'&&lastRoundWon});if(state==='WAIT'){txt('READY...',160,71,2,PAL.cream);txt('HANDS OFF THE TRIGGER!',160,96,1,PAL.white);if(level===9&&playerWins>0){txt('NOT BAD, SHAUN.',160,119,1,PAL.gold);txt('NOW I STOP HOLDING BACK.',160,130,1,PAL.cream)}if(Math.floor(sceneTick/130)%5===0){ctx.fillStyle=PAL.sand;ctx.fillRect((sceneTick*.13)%330,142,7,3)}}else if(state==='FAKE'){txt('DRAW?',160,68,3,PAL.purple);txt('IS IT A TRICK?',160,101,1,PAL.white)}else if(state==='DRAW'){let flash=reduced||Math.floor(sceneTick/100)%2===0;txt('DRAW!',160,65,3,flash?PAL.red:PAL.gold);txt('TAP OR SPACE!',160,101,1,PAL.white)}else if(state==='RESULT'){txt(duelText,160,61,2,duelText.includes('WIN')?PAL.green:PAL.red);if(lastEarly){txt('SHAUN FIRED TOO SOON!',160,88,1,PAL.white);txt('BIRD: FLYING AWAY!',160,99,1,PAL.gold);ctx.fillStyle=PAL.white;let bx=238+Math.sin(sceneTick/90)*18,by=68-Math.sin(sceneTick/120)*8;ctx.fillRect(bx,by,5,2);ctx.fillRect(bx+3,by-2,3,2);ctx.fillRect(bx+4,by+2,4,1)}else{txt('YOU '+(lastReaction===null?'--':lastReaction)+'MS / '+CONFIG.levels[level].name+' '+Math.round(oppR)+'MS',160,91,1,PAL.white);txt('BANG!',160,80,2,PAL.gold);pixelStar(lastRoundWon?239:75,68,PAL.gold);flyingHat(lastRoundWon?243:73,54-Math.min(18,sceneTick*.025),lastRoundWon?PAL.red:PAL.brown);ctx.fillStyle=PAL.yellow;ctx.fillRect(lastRoundWon?103:213,98,3,2)}if(fastestThisRound)txt('FASTEST DRAW!',160,108,1,PAL.gold);txt('HEALTH '+health+'%',160,127,1,PAL.cream);if(level===9&&playerWins>0)pixelStar(90,55,PAL.gold)}}
function gameOverScene(){duelScene();box(43,43,234,100,PAL.ink,PAL.red);txt('GAME OVER',160,51,2,PAL.red);txt(duelText,160,70,1,PAL.cream);['RETRY LEVEL','RESTART GAME','TITLE'].forEach((q,i)=>{let y=91+i*13;txt(q,160,y,1,i===menuIndex?PAL.gold:PAL.white);if(i===menuIndex){ctx.fillStyle=PAL.gold;ctx.fillRect(107,y+2,4,4);ctx.fillRect(111,y+3,3,2)}})}
function ending(){sceneBg();drawSprite(90,83,'SHAUN');drawSprite(140,83,'JASMINE');drawSprite(220,76,'BADE SAHAB');if(endPhase===0){speechBubble('Proud of you, Shaun. You didn\'t just beat me. You earned your name.','BADE SAHAB')}else if(endPhase===1){speechBubble('I learned from the best.','SHAUN')}else if(endPhase===2){speechBubble('You did it! The fastest gun in the West!','JASMINE')}else if(endPhase===3){speechBubble('Now somebody tell your mother we\'re late for dinner.','BADE SAHAB')}else{txt('YOU ARE THE FASTEST',160,38,2,PAL.gold);txt('GUN IN THE WEST!',160,57,2,PAL.cream);for(let i=0;i<10;i++){let x=(i*47+sceneTick*.1)%320,y=35+(i*23+sceneTick*.08)%100;ctx.fillStyle=i%2?PAL.red:PAL.gold;ctx.fillRect(x,y,2,2)}txt('FIREWORKS!',160,145,1,PAL.white)}}
function credits(){sceneBg();txt('CREDITS',160,24,2,PAL.gold);let yy=60-(sceneTick*.018%115);CONFIG.credits.forEach((line,i)=>{let lines=wrap(line,296,1);lines.forEach((l,j)=>txt(l,160,yy+i*39+j*9,1,PAL.white))});txt('BEST DRAW: '+(best===Infinity?'---':best+'MS'),160,148,1,PAL.cream);txt('TAP TO RETURN',160,168,1,PAL.gold)}
// INIT / LOOP
function draw(){ctx.save();if(shake>0){let amount=reduced?1:Math.min(5,shake);ctx.translate(Math.round((Math.random()-.5)*amount),Math.round((Math.random()-.5)*amount));shake=Math.max(0,shake-.22)}if(state==='TITLE')titleScene();else if(state==='LEVEL_SELECT')selectScene();else if(state==='FACEOFF'||state==='HEAL')faceoff();else if(['WAIT','FAKE','DRAW','RESULT'].includes(state))duelScene();else if(state==='GAME_OVER')gameOverScene();else if(state==='ENDING')ending();else if(state==='CREDITS')credits();if(!['TITLE','LEVEL_SELECT','CREDITS'].includes(state))hud();if(paused){box(90,65,140,42,PAL.ink,PAL.gold);txt('PAUSED',160,73,2,PAL.gold);txt('PRESS P TO RESUME',160,96,1,PAL.white)}ctx.restore()}
function loop(now){rafId=requestAnimationFrame(loop);if(!lastFrame)lastFrame=now;let dt=Math.min(50,now-lastFrame);lastFrame=now;frameDelta=dt;acc+=dt;while(acc>=16.666){sceneTick+=16.666;acc-=16.666}if(state==='HEAL'&&healRefilling)health=Math.min(100,Math.round(healStart+(100-healStart)*Math.min(1,sceneTick/2400)));if(!paused)draw()}
loadSave();document.getElementById('mute').textContent='SOUND: '+(muted?'OFF':'ON');window.addEventListener('resize',()=>{ctx.imageSmoothingEnabled=false});rafId=requestAnimationFrame(loop);
})();
</script></body></html>
